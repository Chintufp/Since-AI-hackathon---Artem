#compact-companion-v6 canvas {width:192px;height:192px;display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
#compact-companion-v6 .cc-touch {position:absolute;left:36px;top:30px;width:120px;height:145px;border:0;background:none;}

#compact-companion-v6 .cc-options {display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:10px 15px 0;color:#65747f;font-size:11px;}
#compact-companion-v6 .cc-options select {font-size:11px;padding:4px 6px;min-height:28px;}
#compact-companion-v6 .cc-options label {display:flex;align-items:center;gap:4px;}
#compact-companion-v6 input {accent-color:#344a58;}

@media(pointer:coarse){#compact-companion-v6 .cc-play,#compact-companion-v6 select,#compact-companion-v6 .cc-options select{min-height:44px;}#compact-companion-v6 .cc-options label{min-height:44px;}}
</style>
